spring.application.name=backend

# Activates application-local.properties (git-ignored) which holds the Neon
# credentials. On a real server override this with the SPRING_PROFILES_ACTIVE
# environment variable - it wins over this file.
spring.profiles.active=local

# --- Persistence -------------------------------------------------------------
# Flyway owns the schema. Hibernate only verifies that the entities match the
# tables and must never create or alter them. Never set this to "update".
spring.jpa.hibernate.ddl-auto=validate

# Closes the Hibernate session at the end of the service layer instead of
# keeping it open for the whole request. Prevents lazy loading from firing
# extra queries while the response is being serialized.
spring.jpa.open-in-view=false

# --- Flyway ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator ----------------------------------------------------------------
# health is permitted anonymously in SecurityConfig; expose nothing else.
management.endpoints.web.exposure.include=health,info
